<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Hump chart"><title>Hump chart</title><desc>Cumulative gain rises to about 4.7 million dollars then falls to 0.32 million as loss-making outlets are added.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><line x1="70" y1="40" x2="70" y2="250" class="ln"/><line x1="70" y1="250" x2="680" y2="250" class="ln"/><line x1="66" y1="250.0" x2="70" y2="250.0" class="ln"/><text x="62" y="255.0" text-anchor="end" class="t2"><tspan x="62" dy="0">$0M</tspan></text><line x1="66" y1="166.0" x2="70" y2="166.0" class="ln"/><text x="62" y="171.0" text-anchor="end" class="t2"><tspan x="62" dy="0">$2M</tspan></text><line x1="66" y1="82.0" x2="70" y2="82.0" class="ln"/><text x="62" y="87.0" text-anchor="end" class="t2"><tspan x="62" dy="0">$4M</tspan></text><polyline points="70.0,205.9 92.6,171.4 115.2,144.4 137.8,123.2 160.4,106.6 183.0,93.6 205.6,83.5 228.1,75.5 250.7,69.3 273.3,64.4 295.9,60.6 318.5,57.6 341.1,55.3 363.7,53.4 386.3,55.1 408.9,57.3 431.5,60.1 454.1,63.7 476.7,68.2 499.3,74.0 521.9,81.4 544.4,90.9 567.0,103.0 589.6,118.4 612.2,138.1 634.8,163.3 657.4,195.5 680.0,236.6" class="lna" stroke-linejoin="round"/><circle cx="363.7037037037037" cy="53.440000000000055" r="5" class="accent"/><text x="363.7037037037037" y="41.440000000000055" text-anchor="middle" class="ta"><tspan x="363.7037037037037" dy="0">Peak ≈ $4.7M</tspan></text><circle cx="680.0" cy="236.56" r="5" class="warn"/><text x="666.0" y="232.56" text-anchor="end" class="tb"><tspan x="666.0" dy="0">Whole chain: $0.32M</tspan></text><text x="80" y="274" text-anchor="start" class="t2"><tspan x="80" dy="0">Best outlet</tspan></text><text x="680" y="274" text-anchor="end" class="t2"><tspan x="680" dy="0">Worst outlet</tspan></text><text x="375" y="274" text-anchor="middle" class="tb"><tspan x="375" dy="0">Outlets ranked by gain to operating</tspan></text><text x="360" y="300" text-anchor="middle" class="t2"><tspan x="360" dy="0">Illustrative shape built from the book's totals; intermediate points are not the original data.</tspan></text></svg>
