<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="The kernel of good strategy"><title>The kernel of good strategy</title><desc>Diagnosis, guiding policy and coherent action, with the question each answers.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="20" y="40" width="210" height="130" rx="8" class="accent"/><text x="125" y="78" text-anchor="middle" class="ta"><tspan x="125" dy="0">Diagnosis</tspan></text><text x="125" y="115" text-anchor="middle" class="t2"><tspan x="125" dy="0">What is going on, and what is</tspan><tspan x="125" dy="19">the critical obstacle?</tspan></text><rect x="255" y="40" width="210" height="130" rx="8" class="accent"/><text x="360" y="78" text-anchor="middle" class="ta"><tspan x="360" dy="0">Guiding policy</tspan></text><text x="360" y="115" text-anchor="middle" class="t2"><tspan x="360" dy="0">What overall approach</tspan><tspan x="360" dy="19">will deal with it?</tspan></text><rect x="490" y="40" width="210" height="130" rx="8" class="accent"/><text x="595" y="78" text-anchor="middle" class="ta"><tspan x="595" dy="0">Coherent action</tspan></text><text x="595" y="115" text-anchor="middle" class="t2"><tspan x="595" dy="0">Which coordinated steps</tspan><tspan x="595" dy="19">carry the policy out?</tspan></text><line x1="230" y1="105" x2="252" y2="105" class="ln" marker-end="url(#ah)"/><line x1="465" y1="105" x2="487" y2="105" class="ln" marker-end="url(#ah)"/><text x="360" y="205" text-anchor="middle" class="t2"><tspan x="360" dy="0">Missing any one of the three leaves goals, slogans or a budget, not a strategy.</tspan></text></svg>
