<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Vertical to horizontal computer industry"><title>Vertical to horizontal computer industry</title><desc>Left: each maker owns every layer. Right: specialists compete in each layer.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="170" y="30" text-anchor="middle" class="tb"><tspan x="170" dy="0">Vertical (to the 1980s)</tspan></text><text x="550" y="30" text-anchor="middle" class="tb"><tspan x="550" dy="0">Horizontal (since)</tspan></text><rect x="30" y="50" width="95" height="42" rx="8" class="wash"/><text x="77.5" y="76.0" text-anchor="middle" class=""><tspan x="77.5" dy="0">Service</tspan></text><rect x="30" y="100" width="95" height="42" rx="8" class="wash"/><text x="77.5" y="126.0" text-anchor="middle" class=""><tspan x="77.5" dy="0">Software</tspan></text><rect x="30" y="150" width="95" height="42" rx="8" class="wash"/><text x="77.5" y="176.0" text-anchor="middle" class=""><tspan x="77.5" dy="0">OS</tspan></text><rect x="30" y="200" width="95" height="42" rx="8" class="wash"/><text x="77.5" y="226.0" text-anchor="middle" class=""><tspan x="77.5" dy="0">Chips</tspan></text><text x="77" y="275" text-anchor="middle" class="t2"><tspan x="77" dy="0">IBM</tspan></text><rect x="135" y="50" width="95" height="42" rx="8" class="wash"/><text x="182.5" y="76.0" text-anchor="middle" class=""><tspan x="182.5" dy="0">Service</tspan></text><rect x="135" y="100" width="95" height="42" rx="8" class="wash"/><text x="182.5" y="126.0" text-anchor="middle" class=""><tspan x="182.5" dy="0">Software</tspan></text><rect x="135" y="150" width="95" height="42" rx="8" class="wash"/><text x="182.5" y="176.0" text-anchor="middle" class=""><tspan x="182.5" dy="0">OS</tspan></text><rect x="135" y="200" width="95" height="42" rx="8" class="wash"/><text x="182.5" y="226.0" text-anchor="middle" class=""><tspan x="182.5" dy="0">Chips</tspan></text><text x="182" y="275" text-anchor="middle" class="t2"><tspan x="182" dy="0">DEC</tspan></text><rect x="240" y="50" width="95" height="42" rx="8" class="wash"/><text x="287.5" y="76.0" text-anchor="middle" class=""><tspan x="287.5" dy="0">Service</tspan></text><rect x="240" y="100" width="95" height="42" rx="8" class="wash"/><text x="287.5" y="126.0" text-anchor="middle" class=""><tspan x="287.5" dy="0">Software</tspan></text><rect x="240" y="150" width="95" height="42" rx="8" class="wash"/><text x="287.5" y="176.0" text-anchor="middle" class=""><tspan x="287.5" dy="0">OS</tspan></text><rect x="240" y="200" width="95" height="42" rx="8" class="wash"/><text x="287.5" y="226.0" text-anchor="middle" class=""><tspan x="287.5" dy="0">Chips</tspan></text><text x="287" y="275" text-anchor="middle" class="t2"><tspan x="287" dy="0">Wang</tspan></text><rect x="390" y="50" width="300" height="42" rx="8" class="accent"/><text x="540.0" y="76.0" text-anchor="middle" class=""><tspan x="540.0" dy="0">Service: Resellers, integrators</tspan></text><rect x="390" y="100" width="300" height="42" rx="8" class="accent"/><text x="540.0" y="126.0" text-anchor="middle" class=""><tspan x="540.0" dy="0">Software: Oracle, Lotus</tspan></text><rect x="390" y="150" width="300" height="42" rx="8" class="accent"/><text x="540.0" y="176.0" text-anchor="middle" class=""><tspan x="540.0" dy="0">OS: Microsoft, Unix</tspan></text><rect x="390" y="200" width="300" height="42" rx="8" class="accent"/><text x="540.0" y="226.0" text-anchor="middle" class=""><tspan x="540.0" dy="0">Chips: Intel, AMD</tspan></text><text x="540" y="275" text-anchor="middle" class="t2"><tspan x="540" dy="0">Many vendors per layer</tspan></text><text x="360" y="318" text-anchor="middle" class="t2"><tspan x="360" dy="0">Smart components made proprietary systems engineering unnecessary.</tspan></text></svg>
