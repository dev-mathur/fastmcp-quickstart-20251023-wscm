<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Envelopment"><title>Envelopment</title><desc>A frontal feint holds the enemy while a larger force makes an end run onto its flank and rear.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="20" y="125" width="150" height="60" rx="8" class="wash"/><text x="95.0" y="150.5" text-anchor="middle" class=""><tspan x="95.0" dy="0">Apparent</tspan><tspan x="95.0" dy="19">frontal attack</tspan></text><rect x="410" y="115" width="150" height="80" rx="8" class="warn"/><text x="485.0" y="150.5" text-anchor="middle" class=""><tspan x="485.0" dy="0">Enemy</tspan><tspan x="485.0" dy="19">force</tspan></text><line x1="170" y1="155" x2="405" y2="155" class="ln" marker-end="url(#ah)"/><text x="288" y="143" text-anchor="middle" class="t2"><tspan x="288" dy="0">Holds attention</tspan></text><path d="M95 120 L95 58 L640 58 L640 155 L566 155" class="lna" stroke-linejoin="round" marker-end="url(#ah)"/><text x="368" y="44" text-anchor="middle" class="ta"><tspan x="368" dy="0">Main force: end run onto the flank and rear</tspan></text><text x="360" y="250" text-anchor="middle" class="t2"><tspan x="360" dy="0">The feint keeps the enemy facing front; the end run lands where it is weakest.</tspan></text></svg>
