<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Chain-link system"><title>Chain-link system</title><desc>Overall performance equals the weakest link; strengthening other links adds cost but no strength.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="40" y="80" width="80" height="150" rx="6" class="accent"/><text x="80" y="252" text-anchor="middle" class="t2"><tspan x="80" dy="0">Link 1</tspan></text><rect x="150" y="65" width="80" height="165" rx="6" class="accent"/><text x="190" y="252" text-anchor="middle" class="t2"><tspan x="190" dy="0">Link 2</tspan></text><rect x="260" y="90" width="80" height="140" rx="6" class="accent"/><text x="300" y="252" text-anchor="middle" class="t2"><tspan x="300" dy="0">Link 3</tspan></text><rect x="370" y="175" width="80" height="55" rx="6" class="warn"/><text x="410" y="252" text-anchor="middle" class="t2"><tspan x="410" dy="0">Link 4</tspan></text><rect x="480" y="70" width="80" height="160" rx="6" class="accent"/><text x="520" y="252" text-anchor="middle" class="t2"><tspan x="520" dy="0">Link 5</tspan></text><rect x="590" y="85" width="80" height="145" rx="6" class="accent"/><text x="630" y="252" text-anchor="middle" class="t2"><tspan x="630" dy="0">Link 6</tspan></text><line x1="30" y1="175" x2="700" y2="175" class="ln" stroke-dasharray="6 5"/><text x="360" y="280" text-anchor="middle" class="t2"><tspan x="360" dy="0">Dashed line: system performance, set by the weakest link</tspan></text><text x="410" y="140" text-anchor="middle" class="t2"><tspan x="410" dy="0">Weak link</tspan></text><line x1="30" y1="230" x2="700" y2="230" class="ln"/><text x="360" y="22" text-anchor="middle" class="ta"><tspan x="360" dy="0">Upgrading any other link adds cost, not strength</tspan></text></svg>
