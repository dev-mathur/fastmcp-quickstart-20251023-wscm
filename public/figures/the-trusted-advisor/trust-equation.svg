<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The trust equation"><title>The trust equation</title><desc>Trustworthiness equals credibility plus reliability plus intimacy, divided by self-orientation.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="70" y="86" text-anchor="start" class="tb"><tspan x="70" dy="0">Trustworthiness  =</tspan></text><rect x="270" y="44" width="70" height="56" rx="8" class="accent"/><text x="305.0" y="77.0" text-anchor="middle" class="ta"><tspan x="305.0" dy="0">C</tspan></text><text x="357" y="80" text-anchor="start" class=""><tspan x="357" dy="0">+</tspan></text><rect x="375" y="44" width="70" height="56" rx="8" class="accent"/><text x="410.0" y="77.0" text-anchor="middle" class="ta"><tspan x="410.0" dy="0">R</tspan></text><text x="462" y="80" text-anchor="start" class=""><tspan x="462" dy="0">+</tspan></text><rect x="480" y="44" width="70" height="56" rx="8" class="accent"/><text x="515.0" y="77.0" text-anchor="middle" class="ta"><tspan x="515.0" dy="0">I</tspan></text><line x1="260" y1="112" x2="560" y2="112" class="ln"/><rect x="375" y="122" width="70" height="56" rx="8" class="warn"/><text x="410.0" y="155.0" text-anchor="middle" class="tb"><tspan x="410.0" dy="0">S</tspan></text><text x="590" y="78" text-anchor="start" class="t2"><tspan x="590" dy="0">raises trust</tspan></text><text x="590" y="156" text-anchor="start" class="t2"><tspan x="590" dy="0">lowers trust</tspan></text><rect x="20" y="208" width="165" height="100" rx="8" class="wash"/><text x="102.5" y="234" text-anchor="middle" class="tb"><tspan x="102.5" dy="0">Credibility</tspan></text><text x="102.5" y="256" text-anchor="middle" class="t2"><tspan x="102.5" dy="0">words</tspan></text><text x="102.5" y="274" text-anchor="middle" class="t2"><tspan x="102.5" dy="0">"I can trust what</tspan></text><text x="102.5" y="292" text-anchor="middle" class="t2"><tspan x="102.5" dy="0">she says"</tspan></text><rect x="205" y="208" width="165" height="100" rx="8" class="wash"/><text x="287.5" y="234" text-anchor="middle" class="tb"><tspan x="287.5" dy="0">Reliability</tspan></text><text x="287.5" y="256" text-anchor="middle" class="t2"><tspan x="287.5" dy="0">actions</tspan></text><text x="287.5" y="274" text-anchor="middle" class="t2"><tspan x="287.5" dy="0">"I can trust her</tspan></text><text x="287.5" y="292" text-anchor="middle" class="t2"><tspan x="287.5" dy="0">to deliver"</tspan></text><rect x="390" y="208" width="165" height="100" rx="8" class="wash"/><text x="472.5" y="234" text-anchor="middle" class="tb"><tspan x="472.5" dy="0">Intimacy</tspan></text><text x="472.5" y="256" text-anchor="middle" class="t2"><tspan x="472.5" dy="0">emotions</tspan></text><text x="472.5" y="274" text-anchor="middle" class="t2"><tspan x="472.5" dy="0">"I feel safe</tspan></text><text x="472.5" y="292" text-anchor="middle" class="t2"><tspan x="472.5" dy="0">discussing this"</tspan></text><rect x="575" y="208" width="165" height="100" rx="8" class="warn"/><text x="657.5" y="234" text-anchor="middle" class="tb"><tspan x="657.5" dy="0">Self-orientation</tspan></text><text x="657.5" y="256" text-anchor="middle" class="t2"><tspan x="657.5" dy="0">motives</tspan></text><text x="657.5" y="274" text-anchor="middle" class="t2"><tspan x="657.5" dy="0">"I can trust that</tspan></text><text x="657.5" y="292" text-anchor="middle" class="t2"><tspan x="657.5" dy="0">he cares"</tspan></text></svg>
