<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Three types of cross-selling"><title>Three types of cross-selling</title><desc>A grid of whether the service is new or current against whether the client person is new or current: expand, broaden, diversify.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="30" y="100" text-anchor="start" class="t2"><tspan x="30" dy="0">New service</tspan></text><text x="30" y="230" text-anchor="start" class="t2"><tspan x="30" dy="0">Current service</tspan></text><rect x="150" y="40" width="260" height="120" rx="8" class="box"/><text x="280.0" y="105.0" text-anchor="middle" class="tb"><tspan x="280.0" dy="0">1  Expand</tspan></text><text x="280" y="126" text-anchor="middle" class="t2"><tspan x="280" dy="0">new service, current client person</tspan></text><rect x="420" y="40" width="260" height="120" rx="8" class="warn"/><text x="550.0" y="105.0" text-anchor="middle" class="tb"><tspan x="550.0" dy="0">3  Diversify</tspan></text><text x="550" y="126" text-anchor="middle" class="t2"><tspan x="550" dy="0">new service, new client person</tspan></text><rect x="150" y="170" width="260" height="120" rx="8" class="wash"/><text x="280.0" y="235.0" text-anchor="middle" class="tb"><tspan x="280.0" dy="0">Today</tspan></text><text x="280" y="256" text-anchor="middle" class="t2"><tspan x="280" dy="0">current service, current person</tspan></text><rect x="420" y="170" width="260" height="120" rx="8" class="accent"/><text x="550.0" y="235.0" text-anchor="middle" class="tb"><tspan x="550.0" dy="0">2  Broaden</tspan></text><text x="550" y="256" text-anchor="middle" class="t2"><tspan x="550" dy="0">current service, new client person</tspan></text><text x="280" y="316" text-anchor="middle" class="t2"><tspan x="280" dy="0">Current client person</tspan></text><text x="550" y="316" text-anchor="middle" class="t2"><tspan x="550" dy="0">New client person</tspan></text></svg>
