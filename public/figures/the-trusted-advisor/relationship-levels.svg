<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Four levels of client-advisor relationship"><title>Four levels of client-advisor relationship</title><desc>A staircase from vendor to trusted advisor; the vertical axis is breadth of business issues and the horizontal axis is depth of personal relationship.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><line x1="60" y1="330" x2="60" y2="24" class="ln" marker-end="url(#ah)"/><line x1="60" y1="330" x2="740" y2="330" class="ln" marker-end="url(#ah)"/><text transform="translate(22,180) rotate(-90)" text-anchor="middle" class="t2">Breadth of business issues</text><text x="400" y="362" text-anchor="middle" class="t2"><tspan x="400" dy="0">Depth of personal relationship</tspan></text><rect x="80" y="236" width="205" height="86" rx="8" class="box"/><text x="182.5" y="262" text-anchor="middle" class="tb"><tspan x="182.5" dy="0">1  Vendor</tspan></text><text x="182.5" y="284" text-anchor="middle" class="t2"><tspan x="182.5" dy="0">one task, technical</tspan></text><text x="182.5" y="302" text-anchor="middle" class="t2"><tspan x="182.5" dy="0">skill</tspan></text><rect x="245" y="166" width="205" height="86" rx="8" class="box"/><text x="347.5" y="192" text-anchor="middle" class="tb"><tspan x="347.5" dy="0">2  Problem solver</tspan></text><text x="347.5" y="214" text-anchor="middle" class="t2"><tspan x="347.5" dy="0">broader problems,</tspan></text><text x="347.5" y="232" text-anchor="middle" class="t2"><tspan x="347.5" dy="0">earlier on</tspan></text><rect x="410" y="96" width="205" height="86" rx="8" class="box"/><text x="512.5" y="122" text-anchor="middle" class="tb"><tspan x="512.5" dy="0">3  Valuable resource</tspan></text><text x="512.5" y="144" text-anchor="middle" class="t2"><tspan x="512.5" dy="0">puts issues in context,</tspan></text><text x="512.5" y="162" text-anchor="middle" class="t2"><tspan x="512.5" dy="0">advises proactively</tspan></text><rect x="540" y="26" width="200" height="86" rx="8" class="accent"/><text x="640.0" y="52" text-anchor="middle" class="ta"><tspan x="640.0" dy="0">4  Trusted advisor</tspan></text><text x="640.0" y="74" text-anchor="middle" class="t2"><tspan x="640.0" dy="0">all issues open; the</tspan></text><text x="640.0" y="92" text-anchor="middle" class="t2"><tspan x="640.0" dy="0">client calls first</tspan></text></svg>
