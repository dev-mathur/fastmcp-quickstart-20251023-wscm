<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Five stages of trust building"><title>Five stages of trust building</title><desc>Engage, listen, frame, envision, commit; each with the language it uses.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><polygon points="20,60 140,60 162,105 140,150 20,150" class="box"/><text x="88" y="100" text-anchor="middle" class="tb"><tspan x="88" dy="0">1 Engage</tspan></text><text x="88" y="180" text-anchor="middle" class="t2"><tspan x="88" dy="0">interest and</tspan></text><text x="88" y="198" text-anchor="middle" class="t2"><tspan x="88" dy="0">concern</tspan></text><polygon points="166,60 286,60 308,105 286,150 166,150 188,105" class="box"/><text x="234" y="100" text-anchor="middle" class="tb"><tspan x="234" dy="0">2 Listen</tspan></text><text x="234" y="180" text-anchor="middle" class="t2"><tspan x="234" dy="0">understanding</tspan></text><text x="234" y="198" text-anchor="middle" class="t2"><tspan x="234" dy="0">and empathy</tspan></text><polygon points="312,60 432,60 454,105 432,150 312,150 334,105" class="accent"/><text x="380" y="100" text-anchor="middle" class="tb"><tspan x="380" dy="0">3 Frame</tspan></text><text x="380" y="180" text-anchor="middle" class="t2"><tspan x="380" dy="0">perspective</tspan></text><text x="380" y="198" text-anchor="middle" class="t2"><tspan x="380" dy="0">and candor</tspan></text><polygon points="458,60 578,60 600,105 578,150 458,150 480,105" class="box"/><text x="526" y="100" text-anchor="middle" class="tb"><tspan x="526" dy="0">4 Envision</tspan></text><text x="526" y="180" text-anchor="middle" class="t2"><tspan x="526" dy="0">possibility</tspan></text><polygon points="604,60 724,60 746,105 724,150 604,150 626,105" class="box"/><text x="672" y="100" text-anchor="middle" class="tb"><tspan x="672" dy="0">5 Commit</tspan></text><text x="672" y="180" text-anchor="middle" class="t2"><tspan x="672" dy="0">joint</tspan></text><text x="672" y="198" text-anchor="middle" class="t2"><tspan x="672" dy="0">exploration</tspan></text><text x="380" y="30" text-anchor="middle" class="t2"><tspan x="380" dy="0">Language each stage uses</tspan></text></svg>
