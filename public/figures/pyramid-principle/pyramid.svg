<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="The pyramid of ideas"><title>The pyramid of ideas</title><desc>A main point at the top, key line points below it, and supporting points under each.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="250" y="20" width="220" height="46" rx="8" class="accent"/><text x="360.0" y="48.0" text-anchor="middle" class="ta"><tspan x="360.0" dy="0">Main point</tspan></text><rect x="60" y="120" width="180" height="44" rx="8" class="box"/><text x="150.0" y="147.0" text-anchor="middle" class=""><tspan x="150.0" dy="0">Key line point 1</tspan></text><line x1="360" y1="66" x2="150" y2="120" class="ln"/><rect x="48" y="232" width="100" height="40" rx="8" class="wash"/><text x="98.0" y="257.0" text-anchor="middle" class=""><tspan x="98.0" dy="0">Support</tspan></text><line x1="150" y1="164" x2="98" y2="232" class="ln"/><rect x="152" y="232" width="100" height="40" rx="8" class="wash"/><text x="202.0" y="257.0" text-anchor="middle" class=""><tspan x="202.0" dy="0">Support</tspan></text><line x1="150" y1="164" x2="202" y2="232" class="ln"/><rect x="270" y="120" width="180" height="44" rx="8" class="box"/><text x="360.0" y="147.0" text-anchor="middle" class=""><tspan x="360.0" dy="0">Key line point 2</tspan></text><line x1="360" y1="66" x2="360" y2="120" class="ln"/><rect x="258" y="232" width="100" height="40" rx="8" class="wash"/><text x="308.0" y="257.0" text-anchor="middle" class=""><tspan x="308.0" dy="0">Support</tspan></text><line x1="360" y1="164" x2="308" y2="232" class="ln"/><rect x="362" y="232" width="100" height="40" rx="8" class="wash"/><text x="412.0" y="257.0" text-anchor="middle" class=""><tspan x="412.0" dy="0">Support</tspan></text><line x1="360" y1="164" x2="412" y2="232" class="ln"/><rect x="480" y="120" width="180" height="44" rx="8" class="box"/><text x="570.0" y="147.0" text-anchor="middle" class=""><tspan x="570.0" dy="0">Key line point 3</tspan></text><line x1="360" y1="66" x2="570" y2="120" class="ln"/><rect x="468" y="232" width="100" height="40" rx="8" class="wash"/><text x="518.0" y="257.0" text-anchor="middle" class=""><tspan x="518.0" dy="0">Support</tspan></text><line x1="570" y1="164" x2="518" y2="232" class="ln"/><rect x="572" y="232" width="100" height="40" rx="8" class="wash"/><text x="622.0" y="257.0" text-anchor="middle" class=""><tspan x="622.0" dy="0">Support</tspan></text><line x1="570" y1="164" x2="622" y2="232" class="ln"/><text x="490" y="36" text-anchor="start" class="t2"><tspan x="490" dy="0">Each level answers</tspan><tspan x="490" dy="19">the reader's question</tspan></text><text x="360" y="316" text-anchor="middle" class="t2"><tspan x="360" dy="0">Each point summarizes the group below it; each group holds one kind of idea in a logical order.</tspan></text></svg>
