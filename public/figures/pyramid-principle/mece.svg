<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Mutually exclusive, collectively exhaustive"><title>Mutually exclusive, collectively exhaustive</title><desc>A clean division of company sales beside a division with an overlap and a missing segment.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="170" y="28" text-anchor="middle" class="tb"><tspan x="170" dy="0">Clean division</tspan></text><text x="540" y="28" text-anchor="middle" class="tb"><tspan x="540" dy="0">Flawed division</tspan></text><rect x="105" y="50" width="130" height="44" rx="8" class="accent"/><text x="170.0" y="77.0" text-anchor="middle" class=""><tspan x="170.0" dy="0">Company sales</tspan></text><rect x="20" y="160" width="90" height="50" rx="8" class="box"/><text x="65.0" y="190.0" text-anchor="middle" class=""><tspan x="65.0" dy="0">UK</tspan></text><line x1="170" y1="94" x2="65" y2="160" class="ln"/><rect x="125" y="160" width="90" height="50" rx="8" class="box"/><text x="170.0" y="190.0" text-anchor="middle" class=""><tspan x="170.0" dy="0">Europe</tspan></text><line x1="170" y1="94" x2="170" y2="160" class="ln"/><rect x="230" y="160" width="90" height="50" rx="8" class="box"/><text x="275.0" y="180.5" text-anchor="middle" class=""><tspan x="275.0" dy="0">Rest of</tspan><tspan x="275.0" dy="19">world</tspan></text><line x1="170" y1="94" x2="275" y2="160" class="ln"/><text x="170" y="252" text-anchor="middle" class="ta"><tspan x="170" dy="0">No overlap, nothing left out</tspan></text><rect x="470" y="50" width="140" height="44" rx="8" class="accent"/><text x="540.0" y="77.0" text-anchor="middle" class=""><tspan x="540.0" dy="0">Company sales</tspan></text><rect x="380" y="160" width="76" height="50" rx="8" class="warn"/><text x="418.0" y="190.0" text-anchor="middle" class=""><tspan x="418.0" dy="0">Retail</tspan></text><line x1="540" y1="94" x2="418" y2="160" class="ln"/><rect x="462" y="160" width="76" height="50" rx="8" class="warn"/><text x="500.0" y="190.0" text-anchor="middle" class=""><tspan x="500.0" dy="0">Online</tspan></text><line x1="540" y1="94" x2="500" y2="160" class="ln"/><rect x="544" y="160" width="76" height="50" rx="8" class="box"/><text x="582.0" y="190.0" text-anchor="middle" class=""><tspan x="582.0" dy="0">Export</tspan></text><line x1="540" y1="94" x2="582" y2="160" class="ln"/><rect x="626" y="160" width="76" height="50" rx="8" class="box" stroke-dasharray="5 4"/><text x="664" y="190" text-anchor="middle" class="t2"><tspan x="664" dy="0">Missing</tspan></text><line x1="540" y1="94" x2="664" y2="160" class="ln"/><text x="540" y="252" text-anchor="middle" class="t2"><tspan x="540" dy="0">Retail and online overlap, and a segment is missing</tspan></text><text x="360" y="300" text-anchor="middle" class="t2"><tspan x="360" dy="0">Test every grouping: could one item belong to two boxes, and does anything fall outside all of them?</tspan></text></svg>
