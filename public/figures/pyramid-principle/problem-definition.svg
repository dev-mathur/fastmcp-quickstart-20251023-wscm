<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Problem definition framework"><title>Problem definition framework</title><desc>Opening scene, disturbing event and undesired result lead to the desired result the reader wants.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="20" y="60" width="150" height="110" rx="8" class="box"/><text x="95" y="88" text-anchor="middle" class="tb"><tspan x="95" dy="0">Opening</tspan><tspan x="95" dy="18">scene</tspan></text><text x="95" y="138" text-anchor="middle" class="t2"><tspan x="95" dy="0">The structure or</tspan><tspan x="95" dy="18">process in view</tspan></text><rect x="200" y="60" width="150" height="110" rx="8" class="wash"/><text x="275" y="88" text-anchor="middle" class="tb"><tspan x="275" dy="0">Disturbing</tspan><tspan x="275" dy="18">event</tspan></text><text x="275" y="138" text-anchor="middle" class="t2"><tspan x="275" dy="0">What changed, inside</tspan><tspan x="275" dy="18">or outside the company</tspan></text><rect x="380" y="60" width="150" height="110" rx="8" class="warn"/><text x="455" y="88" text-anchor="middle" class="tb"><tspan x="455" dy="0">Undesired</tspan><tspan x="455" dy="18">result (R1)</tspan></text><text x="455" y="138" text-anchor="middle" class="t2"><tspan x="455" dy="0">The result the reader</tspan><tspan x="455" dy="18">does not like</tspan></text><rect x="560" y="60" width="150" height="110" rx="8" class="accent"/><text x="635" y="88" text-anchor="middle" class="tb"><tspan x="635" dy="0">Desired</tspan><tspan x="635" dy="18">result (R2)</tspan></text><text x="635" y="138" text-anchor="middle" class="t2"><tspan x="635" dy="0">The result the reader</tspan><tspan x="635" dy="18">would rather have</tspan></text><line x1="172" y1="115" x2="198" y2="115" class="ln" marker-end="url(#ah)"/><line x1="352" y1="115" x2="378" y2="115" class="ln" marker-end="url(#ah)"/><path d="M532 115 H556" class="lna" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="545" y="192" text-anchor="middle" class="ta"><tspan x="545" dy="0">gap</tspan></text><rect x="150" y="220" width="420" height="46" rx="8" class="box"/><text x="360.0" y="248.0" text-anchor="middle" class=""><tspan x="360.0" dy="0">Question: how do we get from R1 to R2?</tspan></text><line x1="635" y1="170" x2="570" y2="238" class="lna" marker-end="url(#ah)"/><text x="360" y="304" text-anchor="middle" class="t2"><tspan x="360" dy="0">Solving the problem means changing the structure so that it yields R2 instead of R1.</tspan></text></svg>
