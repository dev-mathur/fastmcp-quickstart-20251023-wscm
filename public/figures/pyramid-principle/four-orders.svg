<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Four logical orders"><title>Four logical orders</title><desc>Time, structural, degree and argument order, each tied to how the grouping was formed.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="8" y="40" width="158" height="190" rx="8" class="accent"/><text x="87" y="76" text-anchor="middle" class="ta"><tspan x="87" dy="0">Time order</tspan></text><text x="87" y="112" text-anchor="middle" class="t2"><tspan x="87" dy="0">Formed from:</tspan></text><text x="87" y="134" text-anchor="middle" class="t2"><tspan x="87" dy="0">Steps in a process,</tspan><tspan x="87" dy="18">or causes of an</tspan><tspan x="87" dy="18">effect</tspan></text><line x1="22" y1="188" x2="152" y2="188" class="ln"/><text x="87" y="213" text-anchor="middle" class="t2"><tspan x="87" dy="0">First, then, finally</tspan></text><rect x="190" y="40" width="158" height="190" rx="8" class="box"/><text x="269" y="76" text-anchor="middle" class="ta"><tspan x="269" dy="0">Structural order</tspan></text><text x="269" y="112" text-anchor="middle" class="t2"><tspan x="269" dy="0">Formed from:</tspan></text><text x="269" y="134" text-anchor="middle" class="t2"><tspan x="269" dy="0">A whole divided</tspan><tspan x="269" dy="18">into its parts</tspan></text><line x1="204" y1="188" x2="334" y2="188" class="ln"/><text x="269" y="213" text-anchor="middle" class="t2"><tspan x="269" dy="0">North, South, Export</tspan></text><rect x="372" y="40" width="158" height="190" rx="8" class="box"/><text x="451" y="76" text-anchor="middle" class="ta"><tspan x="451" dy="0">Degree order</tspan></text><text x="451" y="112" text-anchor="middle" class="t2"><tspan x="451" dy="0">Formed from:</tspan></text><text x="451" y="134" text-anchor="middle" class="t2"><tspan x="451" dy="0">Like things classified</tspan><tspan x="451" dy="18">by a shared trait</tspan></text><line x1="386" y1="188" x2="516" y2="188" class="ln"/><text x="451" y="213" text-anchor="middle" class="t2"><tspan x="451" dy="0">Strongest reason first</tspan></text><rect x="554" y="40" width="158" height="190" rx="8" class="box"/><text x="633" y="76" text-anchor="middle" class="ta"><tspan x="633" dy="0">Argument order</tspan></text><text x="633" y="112" text-anchor="middle" class="t2"><tspan x="633" dy="0">Formed from:</tspan></text><text x="633" y="134" text-anchor="middle" class="t2"><tspan x="633" dy="0">A deductive chain of</tspan><tspan x="633" dy="18">linked statements</tspan></text><line x1="568" y1="188" x2="698" y2="188" class="ln"/><text x="633" y="213" text-anchor="middle" class="t2"><tspan x="633" dy="0">Premise, premise, so</tspan></text><text x="360" y="272" text-anchor="middle" class="t2"><tspan x="360" dy="0">Only four mental activities create groups, so these are the only orders a grouping can have.</tspan></text><text x="360" y="304" text-anchor="middle" class="t2"><tspan x="360" dy="0">The order you use shows which kind of grouping you made and whether anything is missing.</tspan></text></svg>
