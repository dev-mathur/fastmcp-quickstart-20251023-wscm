<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Deduction versus induction"><title>Deduction versus induction</title><desc>A deductive chain of three linked statements beside an inductive grouping of three like ideas.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="180" y="28" text-anchor="middle" class="tb"><tspan x="180" dy="0">Deduction: a chain</tspan></text><text x="540" y="28" text-anchor="middle" class="tb"><tspan x="540" dy="0">Induction: a grouping</tspan></text><rect x="30" y="50" width="300" height="52" rx="8" class="box"/><text x="180.0" y="71.5" text-anchor="middle" class=""><tspan x="180.0" dy="0">Every contract over $50k</tspan><tspan x="180.0" dy="19">needs legal review</tspan></text><line x1="180" y1="102" x2="180" y2="128" class="ln" marker-end="url(#ah)"/><rect x="30" y="130" width="300" height="52" rx="8" class="box"/><text x="180.0" y="161.0" text-anchor="middle" class=""><tspan x="180.0" dy="0">This contract is for $80k</tspan></text><line x1="180" y1="182" x2="180" y2="208" class="ln" marker-end="url(#ah)"/><rect x="30" y="210" width="300" height="52" rx="8" class="accent"/><text x="180.0" y="241.0" text-anchor="middle" class=""><tspan x="180.0" dy="0">So it needs legal review</tspan></text><rect x="440" y="50" width="200" height="52" rx="8" class="accent"/><text x="540.0" y="71.5" text-anchor="middle" class=""><tspan x="540.0" dy="0">Rivals are moving</tspan><tspan x="540.0" dy="19">against us</tspan></text><rect x="380" y="170" width="100" height="66" rx="8" class="box"/><text x="430.0" y="198.5" text-anchor="middle" class=""><tspan x="430.0" dy="0">Rival A</tspan><tspan x="430.0" dy="19">cut prices</tspan></text><line x1="540" y1="102" x2="430" y2="170" class="ln"/><rect x="490" y="170" width="100" height="66" rx="8" class="box"/><text x="540.0" y="189.0" text-anchor="middle" class=""><tspan x="540.0" dy="0">Rival B</tspan><tspan x="540.0" dy="19">launched a</tspan><tspan x="540.0" dy="19">substitute</tspan></text><line x1="540" y1="102" x2="540" y2="170" class="ln"/><rect x="600" y="170" width="100" height="66" rx="8" class="box"/><text x="650.0" y="189.0" text-anchor="middle" class=""><tspan x="650.0" dy="0">Rival C</tspan><tspan x="650.0" dy="19">hired our</tspan><tspan x="650.0" dy="19">sales staff</tspan></text><line x1="540" y1="102" x2="650" y2="170" class="ln"/><text x="180" y="276" text-anchor="middle" class="t2"><tspan x="180" dy="0">Each point comments on the one before;</tspan><tspan x="180" dy="19">the conclusion rests on the last.</tspan></text><text x="540" y="276" text-anchor="middle" class="t2"><tspan x="540" dy="0">Points are alike; the top point says</tspan><tspan x="540" dy="19">what the likeness implies.</tspan></text><text x="360" y="322" text-anchor="middle" class="t2"><tspan x="360" dy="0">On the key line Minto prefers induction, and pushes deduction lower in the pyramid.</tspan></text></svg>
