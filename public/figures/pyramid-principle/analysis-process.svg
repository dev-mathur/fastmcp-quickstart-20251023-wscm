<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Two ways to run an analysis"><title>Two ways to run an analysis</title><desc>The usual approach gathers data first; the better approach structures the analysis before gathering data.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="20" y="40" text-anchor="start" class="tb"><tspan x="20" dy="0">Common approach</tspan></text><rect x="20" y="54" width="140" height="56" rx="8" class="wash"/><text x="90.0" y="77.5" text-anchor="middle" class=""><tspan x="90.0" dy="0">Gather whatever</tspan><tspan x="90.0" dy="19">data exists</tspan></text><rect x="200" y="54" width="140" height="56" rx="8" class="wash"/><text x="270.0" y="77.5" text-anchor="middle" class=""><tspan x="270.0" dy="0">State</tspan><tspan x="270.0" dy="19">findings</tspan></text><rect x="380" y="54" width="140" height="56" rx="8" class="wash"/><text x="450.0" y="77.5" text-anchor="middle" class=""><tspan x="450.0" dy="0">Draw</tspan><tspan x="450.0" dy="19">conclusions</tspan></text><rect x="560" y="54" width="140" height="56" rx="8" class="wash"/><text x="630.0" y="77.5" text-anchor="middle" class=""><tspan x="630.0" dy="0">Recommend</tspan><tspan x="630.0" dy="19">actions</tspan></text><line x1="162" y1="82" x2="198" y2="82" class="ln" marker-end="url(#ah)"/><line x1="342" y1="82" x2="378" y2="82" class="ln" marker-end="url(#ah)"/><line x1="522" y1="82" x2="558" y2="82" class="ln" marker-end="url(#ah)"/><text x="20" y="148" text-anchor="start" class="ta"><tspan x="20" dy="0">Better approach</tspan></text><rect x="20" y="162" width="140" height="56" rx="8" class="accent"/><text x="90.0" y="185.5" text-anchor="middle" class=""><tspan x="90.0" dy="0">Define the</tspan><tspan x="90.0" dy="19">problem</tspan></text><rect x="200" y="162" width="140" height="56" rx="8" class="accent"/><text x="270.0" y="185.5" text-anchor="middle" class=""><tspan x="270.0" dy="0">Structure the</tspan><tspan x="270.0" dy="19">analysis</tspan></text><rect x="380" y="162" width="140" height="56" rx="8" class="accent"/><text x="450.0" y="185.5" text-anchor="middle" class=""><tspan x="450.0" dy="0">Gather only the</tspan><tspan x="450.0" dy="19">data that tests it</tspan></text><rect x="560" y="162" width="140" height="56" rx="8" class="accent"/><text x="630.0" y="185.5" text-anchor="middle" class=""><tspan x="630.0" dy="0">Form the</tspan><tspan x="630.0" dy="19">pyramid</tspan></text><line x1="162" y1="190" x2="198" y2="190" class="lna" marker-end="url(#ah)"/><line x1="342" y1="190" x2="378" y2="190" class="lna" marker-end="url(#ah)"/><line x1="522" y1="190" x2="558" y2="190" class="lna" marker-end="url(#ah)"/><text x="360" y="255" text-anchor="middle" class="t2"><tspan x="360" dy="0">Deciding what you need to know first saves effort and makes the findings easy to pyramid.</tspan></text></svg>
