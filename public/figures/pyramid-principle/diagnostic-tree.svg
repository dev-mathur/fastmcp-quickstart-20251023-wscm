<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Diagnostic framework for falling profit"><title>Diagnostic framework for falling profit</title><desc>A logic tree splits falling profit into revenue and cost causes, then into narrower yes or no questions.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="20" y="152" width="130" height="50" rx="8" class="accent"/><text x="85.0" y="182.0" text-anchor="middle" class=""><tspan x="85.0" dy="0">Profit is down</tspan></text><rect x="190" y="92" width="150" height="44" rx="8" class="box"/><text x="265.0" y="119.0" text-anchor="middle" class=""><tspan x="265.0" dy="0">Revenue too low</tspan></text><rect x="190" y="222" width="150" height="44" rx="8" class="box"/><text x="265.0" y="249.0" text-anchor="middle" class=""><tspan x="265.0" dy="0">Costs too high</tspan></text><rect x="380" y="40" width="130" height="40" rx="8" class="box"/><text x="445.0" y="65.0" text-anchor="middle" class=""><tspan x="445.0" dy="0">Prices lower</tspan></text><rect x="380" y="100" width="130" height="40" rx="8" class="accent"/><text x="445.0" y="125.0" text-anchor="middle" class=""><tspan x="445.0" dy="0">Volume lower</tspan></text><rect x="380" y="200" width="130" height="40" rx="8" class="box"/><text x="445.0" y="225.0" text-anchor="middle" class=""><tspan x="445.0" dy="0">Fixed costs up</tspan></text><rect x="380" y="260" width="130" height="40" rx="8" class="box"/><text x="445.0" y="285.0" text-anchor="middle" class=""><tspan x="445.0" dy="0">Variable costs up</tspan></text><rect x="550" y="78" width="140" height="36" rx="8" class="accent"/><text x="620.0" y="101.0" text-anchor="middle" class=""><tspan x="620.0" dy="0">Fewer customers?</tspan></text><rect x="550" y="126" width="140" height="36" rx="8" class="box"/><text x="620.0" y="149.0" text-anchor="middle" class=""><tspan x="620.0" dy="0">Smaller orders?</tspan></text><path d="M150 177 H170.0 V114 H190" class="ln"/><path d="M150 177 H170.0 V244 H190" class="ln"/><path d="M340 114 H360.0 V60 H380" class="ln"/><path d="M340 114 H360.0 V120 H380" class="ln"/><path d="M340 244 H360.0 V220 H380" class="ln"/><path d="M340 244 H360.0 V280 H380" class="ln"/><path d="M510 120 H530.0 V96 H550" class="ln"/><path d="M510 120 H530.0 V144 H550" class="ln"/><text x="360" y="340" text-anchor="middle" class="t2"><tspan x="360" dy="0">Each box is a yes or no question that tells you which data to gather, and which to ignore.</tspan></text></svg>
