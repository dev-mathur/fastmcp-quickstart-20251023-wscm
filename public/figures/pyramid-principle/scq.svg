<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Situation, complication, question, answer"><title>Situation, complication, question, answer</title><desc>The introduction tells a story the reader already knows so the main point answers a question already in the reader's mind.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="17" y="90" width="145" height="100" rx="8" class="box"/><text x="89" y="125" text-anchor="middle" class="tb"><tspan x="89" dy="0">Situation</tspan></text><text x="89" y="152" text-anchor="middle" class="t2"><tspan x="89" dy="0">Something the reader</tspan><tspan x="89" dy="18">knows and accepts</tspan></text><rect x="197" y="90" width="145" height="100" rx="8" class="warn"/><text x="269" y="125" text-anchor="middle" class="tb"><tspan x="269" dy="0">Complication</tspan></text><text x="269" y="152" text-anchor="middle" class="t2"><tspan x="269" dy="0">What changed or went</tspan><tspan x="269" dy="18">wrong in that situation</tspan></text><rect x="377" y="90" width="145" height="100" rx="8" class="box"/><text x="449" y="125" text-anchor="middle" class="tb"><tspan x="449" dy="0">Question</tspan></text><text x="449" y="152" text-anchor="middle" class="t2"><tspan x="449" dy="0">What the reader now</tspan><tspan x="449" dy="18">wants answered</tspan></text><rect x="557" y="90" width="145" height="100" rx="8" class="accent"/><text x="629" y="125" text-anchor="middle" class="ta"><tspan x="629" dy="0">Answer</tspan></text><text x="629" y="152" text-anchor="middle" class="t2"><tspan x="629" dy="0">Your main point,</tspan><tspan x="629" dy="18">the top of the pyramid</tspan></text><line x1="164" y1="140" x2="194" y2="140" class="ln" marker-end="url(#ah)"/><line x1="344" y1="140" x2="374" y2="140" class="ln" marker-end="url(#ah)"/><line x1="524" y1="140" x2="554" y2="140" class="ln" marker-end="url(#ah)"/><line x1="17" y1="70" x2="522" y2="70" class="ln"/><line x1="17" y1="70" x2="17" y2="80" class="ln"/><line x1="522" y1="70" x2="522" y2="80" class="ln"/><text x="270" y="58" text-anchor="middle" class="tb"><tspan x="270" dy="0">Introduction</tspan></text><text x="360" y="250" text-anchor="middle" class="t2"><tspan x="360" dy="0">The reader nods at the situation, sees the complication and asks the question you then answer.</tspan></text></svg>
