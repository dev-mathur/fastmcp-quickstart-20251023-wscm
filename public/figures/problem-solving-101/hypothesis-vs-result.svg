<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Hypothesis versus result"><title>Hypothesis versus result</title><desc>The band guessed 5, 60 and 100 percent; the survey found 30, 10 and 80 percent.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="300" y="14" width="14" height="14" rx="3" class="wash"/><text x="322" y="26" text-anchor="start" class="t2"><tspan x="322" dy="0">Guess</tspan></text><rect x="400" y="14" width="14" height="14" rx="3" class="accent"/><text x="422" y="26" text-anchor="start" class="t2"><tspan x="422" dy="0">Survey result</tspan></text><text x="20" y="78" text-anchor="start" class=""><tspan x="20" dy="0">Know about the concerts</tspan></text><rect x="300" y="52" width="17.0" height="20" rx="4" class="wash"/><text x="325.0" y="67" text-anchor="start" class="t2"><tspan x="325.0" dy="0">5%</tspan></text><rect x="300" y="78" width="102.0" height="20" rx="4" class="accent"/><text x="410.0" y="93" text-anchor="start" class="ta"><tspan x="410.0" dy="0">30%</tspan></text><text x="20" y="148" text-anchor="start" class=""><tspan x="20" dy="0">Aware people who attend</tspan></text><rect x="300" y="122" width="204.0" height="20" rx="4" class="wash"/><text x="512.0" y="137" text-anchor="start" class="t2"><tspan x="512.0" dy="0">60%</tspan></text><rect x="300" y="148" width="34.0" height="20" rx="4" class="accent"/><text x="342.0" y="163" text-anchor="start" class="ta"><tspan x="342.0" dy="0">10%</tspan></text><text x="20" y="218" text-anchor="start" class=""><tspan x="20" dy="0">Attendees who come back</tspan></text><rect x="300" y="192" width="340.0" height="20" rx="4" class="wash"/><text x="648.0" y="207" text-anchor="start" class="t2"><tspan x="648.0" dy="0">100%</tspan></text><rect x="300" y="218" width="272.0" height="20" rx="4" class="accent"/><text x="580.0" y="233" text-anchor="start" class="ta"><tspan x="580.0" dy="0">80%</tspan></text><text x="360" y="278" text-anchor="middle" class="t2"><tspan x="360" dy="0">Awareness was higher than assumed, but turning awareness into attendance was the real weak point.</tspan></text></svg>
