<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Criteria and evaluation"><title>Criteria and evaluation</title><desc>Three schools rated against seven weighted criteria; Beaver High scores best on the high-importance rows.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="460" y="20" width="120" height="270" rx="6" class="accent"/><text x="28" y="44" text-anchor="start" class="tb"><tspan x="28" dy="0">Criterion</tspan></text><text x="295.0" y="44" text-anchor="middle" class="tb"><tspan x="295.0" dy="0">Importance</tspan></text><text x="400.0" y="44" text-anchor="middle" class="tb"><tspan x="400.0" dy="0">Armadillo HS</tspan></text><text x="520.0" y="44" text-anchor="middle" class="tb"><tspan x="520.0" dy="0">Beaver HS</tspan></text><text x="640.0" y="44" text-anchor="middle" class="tb"><tspan x="640.0" dy="0">Cougar HS</tspan></text><line x1="20" y1="56" x2="700" y2="56" class="ln"/><text x="28" y="82" text-anchor="start" class=""><tspan x="28" dy="0">Quality of education</tspan></text><text x="295.0" y="82" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">High</tspan></text><text x="400.0" y="82" text-anchor="middle" class=""><tspan x="400.0" dy="0">+++</tspan></text><text x="520.0" y="82" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">+++</tspan></text><text x="640.0" y="82" text-anchor="middle" class=""><tspan x="640.0" dy="0">+</tspan></text><text x="28" y="112" text-anchor="start" class=""><tspan x="28" dy="0">Study abroad program</tspan></text><text x="295.0" y="112" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">High</tspan></text><text x="400.0" y="112" text-anchor="middle" class=""><tspan x="400.0" dy="0">+ (no)</tspan></text><text x="520.0" y="112" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">+++ (yes)</tspan></text><text x="640.0" y="112" text-anchor="middle" class=""><tspan x="640.0" dy="0">+ (no)</tspan></text><text x="28" y="142" text-anchor="start" class=""><tspan x="28" dy="0">Cost of tuition</tspan></text><text x="295.0" y="142" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">High</tspan></text><text x="400.0" y="142" text-anchor="middle" class=""><tspan x="400.0" dy="0">+++ (free)</tspan></text><text x="520.0" y="142" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">+++ (free)</tspan></text><text x="640.0" y="142" text-anchor="middle" class=""><tspan x="640.0" dy="0">+ ($15,000)</tspan></text><text x="28" y="172" text-anchor="start" class=""><tspan x="28" dy="0">Strength of hockey team</tspan></text><text x="295.0" y="172" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">Medium</tspan></text><text x="400.0" y="172" text-anchor="middle" class=""><tspan x="400.0" dy="0">++</tspan></text><text x="520.0" y="172" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">++</tspan></text><text x="640.0" y="172" text-anchor="middle" class=""><tspan x="640.0" dy="0">+</tspan></text><text x="28" y="202" text-anchor="start" class=""><tspan x="28" dy="0">Friends attending</tspan></text><text x="295.0" y="202" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">Medium</tspan></text><text x="400.0" y="202" text-anchor="middle" class=""><tspan x="400.0" dy="0">++</tspan></text><text x="520.0" y="202" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">+++</tspan></text><text x="640.0" y="202" text-anchor="middle" class=""><tspan x="640.0" dy="0">+</tspan></text><text x="28" y="232" text-anchor="start" class=""><tspan x="28" dy="0">Distance to school</tspan></text><text x="295.0" y="232" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">Low</tspan></text><text x="400.0" y="232" text-anchor="middle" class=""><tspan x="400.0" dy="0">+ (25 min)</tspan></text><text x="520.0" y="232" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">+ (30 min)</tspan></text><text x="640.0" y="232" text-anchor="middle" class=""><tspan x="640.0" dy="0">++ (5 min)</tspan></text><text x="28" y="262" text-anchor="start" class=""><tspan x="28" dy="0">Newness of building</tspan></text><text x="295.0" y="262" text-anchor="middle" class="t2"><tspan x="295.0" dy="0">Low</tspan></text><text x="400.0" y="262" text-anchor="middle" class=""><tspan x="400.0" dy="0">+</tspan></text><text x="520.0" y="262" text-anchor="middle" class="ta"><tspan x="520.0" dy="0">+</tspan></text><text x="640.0" y="262" text-anchor="middle" class=""><tspan x="640.0" dy="0">++</tspan></text><text x="360" y="322" text-anchor="middle" class="t2"><tspan x="360" dy="0">Pick the option that wins on the heavily weighted criteria, not the most plus signs overall.</tspan></text></svg>
