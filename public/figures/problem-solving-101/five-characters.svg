<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="Five ways to approach a problem"><title>Five ways to approach a problem</title><desc>Paths from start to goal for Miss Sigh, Mr. Critic, Miss Dreamer, Mr. Go-Getter and the problem-solving kid.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="12" y="30" width="132" height="205" rx="8" class="wash"/><circle cx="78" cy="62" r="6" class="accent"/><text x="78" y="52" text-anchor="middle" class="t2"><tspan x="78" dy="0">Goal</tspan></text><circle cx="78" cy="205" r="5" class="box"/><text x="78" y="224" text-anchor="middle" class="t2"><tspan x="78" dy="0">Start</tspan></text><circle cx="78" cy="190" r="16" class="ln"/><text x="78" y="262" text-anchor="middle" class=""><tspan x="78" dy="0">Miss Sigh</tspan></text><rect x="154" y="30" width="132" height="205" rx="8" class="wash"/><circle cx="220" cy="62" r="6" class="accent"/><text x="220" y="52" text-anchor="middle" class="t2"><tspan x="220" dy="0">Goal</tspan></text><circle cx="220" cy="205" r="5" class="box"/><text x="220" y="224" text-anchor="middle" class="t2"><tspan x="220" dy="0">Start</tspan></text><line x1="220" y1="205" x2="178" y2="150" class="ln" stroke-dasharray="4 4"/><text x="178" y="146" text-anchor="middle" class="tb"><tspan x="178" dy="0">×</tspan></text><line x1="220" y1="205" x2="220" y2="150" class="ln" stroke-dasharray="4 4"/><text x="220" y="146" text-anchor="middle" class="tb"><tspan x="220" dy="0">×</tspan></text><line x1="220" y1="205" x2="262" y2="150" class="ln" stroke-dasharray="4 4"/><text x="262" y="146" text-anchor="middle" class="tb"><tspan x="262" dy="0">×</tspan></text><text x="220" y="262" text-anchor="middle" class=""><tspan x="220" dy="0">Mr. Critic</tspan></text><rect x="296" y="30" width="132" height="205" rx="8" class="wash"/><circle cx="362" cy="62" r="6" class="accent"/><text x="362" y="52" text-anchor="middle" class="t2"><tspan x="362" dy="0">Goal</tspan></text><circle cx="362" cy="205" r="5" class="box"/><text x="362" y="224" text-anchor="middle" class="t2"><tspan x="362" dy="0">Start</tspan></text><line x1="362" y1="198" x2="362" y2="72" class="ln" stroke-dasharray="2 5"/><text x="362" y="262" text-anchor="middle" class=""><tspan x="362" dy="0">Miss Dreamer</tspan></text><rect x="438" y="30" width="132" height="205" rx="8" class="wash"/><circle cx="504" cy="62" r="6" class="accent"/><text x="504" y="52" text-anchor="middle" class="t2"><tspan x="504" dy="0">Goal</tspan></text><circle cx="504" cy="205" r="5" class="box"/><text x="504" y="224" text-anchor="middle" class="t2"><tspan x="504" dy="0">Start</tspan></text><polyline points="504,205 549,170 464,140 552,108 474,84" class="ln" stroke-linejoin="round" marker-end="url(#ah)"/><text x="504" y="262" text-anchor="middle" class=""><tspan x="504" dy="0">Mr. Go-Getter</tspan></text><rect x="580" y="30" width="132" height="205" rx="8" class="wash"/><circle cx="646" cy="62" r="6" class="accent"/><text x="646" y="52" text-anchor="middle" class="t2"><tspan x="646" dy="0">Goal</tspan></text><circle cx="646" cy="205" r="5" class="box"/><text x="646" y="224" text-anchor="middle" class="t2"><tspan x="646" dy="0">Start</tspan></text><line x1="646" y1="198" x2="646" y2="72" class="lna" marker-end="url(#ah)"/><line x1="639" y1="160" x2="653" y2="160" class="lna"/><line x1="639" y1="118" x2="653" y2="118" class="lna"/><text x="646" y="262" text-anchor="middle" class="tb"><tspan x="646" dy="0">Problem-solving</tspan><tspan x="646" dy="19">kid</tspan></text><text x="360" y="302" text-anchor="middle" class="t2"><tspan x="360" dy="0">Only the problem-solving kid finds the root cause, plans, acts and checks progress.</tspan></text></svg>
