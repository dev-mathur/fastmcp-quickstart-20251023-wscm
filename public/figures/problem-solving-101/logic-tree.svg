<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Logic tree for more pepper"><title>Logic tree for more pepper</title><desc>A logic tree splits the goal of getting more pepper per shake into non-overlapping branches.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="20" y="148" width="150" height="56" rx="8" class="accent"/><text x="95.0" y="171.5" text-anchor="middle" class=""><tspan x="95.0" dy="0">More pepper</tspan><tspan x="95.0" dy="19">per shake</tspan></text><rect x="215" y="58" width="165" height="44" rx="8" class="box"/><text x="297.5" y="85.0" text-anchor="middle" class=""><tspan x="297.5" dy="0">Bigger top surface</tspan></text><rect x="215" y="215" width="165" height="44" rx="8" class="box"/><text x="297.5" y="232.5" text-anchor="middle" class=""><tspan x="297.5" dy="0">More pepper from</tspan><tspan x="297.5" dy="19">the same surface</tspan></text><rect x="425" y="168" width="130" height="44" rx="8" class="box"/><text x="490.0" y="195.0" text-anchor="middle" class=""><tspan x="490.0" dy="0">More holes</tspan></text><rect x="425" y="262" width="130" height="44" rx="8" class="box"/><text x="490.0" y="289.0" text-anchor="middle" class=""><tspan x="490.0" dy="0">More per hole</tspan></text><rect x="590" y="232" width="110" height="40" rx="8" class="accent"/><text x="645.0" y="257.0" text-anchor="middle" class=""><tspan x="645.0" dy="0">Bigger holes</tspan></text><rect x="590" y="286" width="110" height="40" rx="8" class="box"/><text x="645.0" y="311.0" text-anchor="middle" class=""><tspan x="645.0" dy="0">Finer grains</tspan></text><path d="M170 176 H192.5 V80 H215" class="ln"/><path d="M170 176 H192.5 V237 H215" class="ln"/><path d="M380 237 H402.5 V190 H425" class="ln"/><path d="M380 237 H402.5 V284 H425" class="ln"/><path d="M555 284 H572.5 V252 H590" class="ln"/><path d="M555 284 H572.5 V306 H590" class="ln"/><text x="360" y="350" text-anchor="middle" class="t2"><tspan x="360" dy="0">Branches never overlap and together cover every option, so none gets overlooked.</tspan></text></svg>
