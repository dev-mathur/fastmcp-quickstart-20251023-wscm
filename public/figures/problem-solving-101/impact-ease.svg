<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-label="Impact versus ease of implementation"><title>Impact versus ease of implementation</title><desc>A two by two matrix: high impact and easy actions come first.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="90" y="40" width="250" height="120" rx="8" class="wash"/><text x="102" y="62" text-anchor="start" class="tb"><tspan x="102" dy="0">Do next</tspan></text><rect x="350" y="40" width="250" height="120" rx="8" class="accent"/><text x="362" y="62" text-anchor="start" class="tb"><tspan x="362" dy="0">Do first</tspan></text><rect x="90" y="170" width="250" height="120" rx="8" class="box"/><text x="102" y="192" text-anchor="start" class="tb"><tspan x="102" dy="0">Do last</tspan></text><rect x="350" y="170" width="250" height="120" rx="8" class="wash"/><text x="362" y="192" text-anchor="start" class="tb"><tspan x="362" dy="0">Do next</tspan></text><circle cx="120" cy="90" r="6" class="accent"/><text x="134" y="95" text-anchor="start" class="t2"><tspan x="134" dy="0">Perform in every class</tspan></text><circle cx="380" cy="90" r="6" class="accent"/><text x="394" y="95" text-anchor="start" class="t2"><tspan x="394" dy="0">Poster, with John's help</tspan></text><circle cx="120" cy="235" r="6" class="warn"/><text x="134" y="240" text-anchor="start" class="t2"><tspan x="134" dy="0">Poster, done alone</tspan></text><circle cx="380" cy="235" r="6" class="accent"/><text x="394" y="240" text-anchor="start" class="t2"><tspan x="394" dy="0">Class message boards</tspan></text><line x1="132" y1="226" x2="372" y2="100" class="lna" marker-end="url(#ah)"/><text x="605" y="160" text-anchor="start" class=""><tspan x="605" dy="0"></tspan></text><text x="90" y="322" text-anchor="start" class="t2"><tspan x="90" dy="0">Hard</tspan></text><text x="600" y="322" text-anchor="end" class="t2"><tspan x="600" dy="0">Easy</tspan></text><text x="345" y="335" text-anchor="middle" class="tb"><tspan x="345" dy="0">Ease of implementation</tspan></text><text transform="translate(40 165) rotate(-90)" text-anchor="middle" class="tb">Impact</text><text x="72" y="56" text-anchor="end" class="t2"><tspan x="72" dy="0">High</tspan></text><text x="72" y="286" text-anchor="end" class="t2"><tspan x="72" dy="0">Low</tspan></text><text x="360" y="362" text-anchor="middle" class="t2"><tspan x="360" dy="0">Getting help moves an action toward the top right.</tspan></text></svg>
