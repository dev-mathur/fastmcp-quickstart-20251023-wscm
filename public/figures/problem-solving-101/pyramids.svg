<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="Two hypothesis pyramids"><title>Two hypothesis pyramids</title><desc>A grouping structure with three parallel supports and an argument structure with two linked statements.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><text x="185" y="26" text-anchor="middle" class="tb"><tspan x="185" dy="0">Grouping structure</tspan></text><text x="550" y="26" text-anchor="middle" class="tb"><tspan x="550" dy="0">Argument structure</tspan></text><rect x="100" y="50" width="170" height="50" rx="8" class="accent"/><text x="185.0" y="80.0" text-anchor="middle" class=""><tspan x="185.0" dy="0">School is fun</tspan></text><rect x="30" y="160" width="100" height="56" rx="8" class="box"/><text x="80.0" y="183.5" text-anchor="middle" class=""><tspan x="80.0" dy="0">School sports</tspan><tspan x="80.0" dy="19">are fun</tspan></text><line x1="185" y1="100" x2="80" y2="160" class="ln"/><rect x="140" y="160" width="100" height="56" rx="8" class="box"/><text x="190.0" y="183.5" text-anchor="middle" class=""><tspan x="190.0" dy="0">Lunchtime</tspan><tspan x="190.0" dy="19">is fun</tspan></text><line x1="185" y1="100" x2="190" y2="160" class="ln"/><rect x="250" y="160" width="100" height="56" rx="8" class="box"/><text x="300.0" y="183.5" text-anchor="middle" class=""><tspan x="300.0" dy="0">Classes</tspan><tspan x="300.0" dy="19">are fun</tspan></text><line x1="185" y1="100" x2="300" y2="160" class="ln"/><rect x="465" y="50" width="170" height="50" rx="8" class="accent"/><text x="550.0" y="70.5" text-anchor="middle" class=""><tspan x="550.0" dy="0">Salmon are</tspan><tspan x="550.0" dy="19">good swimmers</tspan></text><rect x="395" y="160" width="140" height="56" rx="8" class="box"/><text x="465.0" y="183.5" text-anchor="middle" class=""><tspan x="465.0" dy="0">Salmon</tspan><tspan x="465.0" dy="19">are fish</tspan></text><line x1="550" y1="100" x2="465" y2="160" class="ln"/><rect x="555" y="160" width="140" height="56" rx="8" class="box"/><text x="625.0" y="183.5" text-anchor="middle" class=""><tspan x="625.0" dy="0">Fish are good</tspan><tspan x="625.0" dy="19">swimmers</tspan></text><line x1="550" y1="100" x2="625" y2="160" class="ln"/><text x="185" y="256" text-anchor="middle" class="t2"><tspan x="185" dy="0">Separate supports: if one fails,</tspan><tspan x="185" dy="19">the claim can still stand.</tspan></text><text x="550" y="256" text-anchor="middle" class="t2"><tspan x="550" dy="0">Linked statements: if one fails,</tspan><tspan x="550" dy="19">the conclusion falls.</tspan></text></svg>
