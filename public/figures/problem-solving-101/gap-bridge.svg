<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Closing John's gap"><title>Closing John's gap</title><desc>The $500 computer goal is reached by $252 of projected savings plus $60 of spending cuts, $50 from selling things and $138 from walking more dogs.</desc><style>
:root{--paper:#ffffff;--wash:#f6f6f3;--ink:#18181b;--ink2:#52525b;--line:#c9c9c2;--accent:#2b50d8;--accentwash:#eef1fd;--warn:#b4531a;--warnwash:#fbeee3}
@media (prefers-color-scheme:dark){:root{--paper:#1a1a1d;--wash:#222226;--ink:#ececee;--ink2:#a8a8b0;--line:#3a3a40;--accent:#8aa3ff;--accentwash:#1b2140;--warn:#f0a070;--warnwash:#3a2a1f}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ink);font-size:15px}
.t2{fill:var(--ink2);font-size:13px}.tb{font-weight:600}.ta{fill:var(--accent);font-weight:600}
.box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.accent{fill:var(--accentwash);stroke:var(--accent);stroke-width:1.5}
.warn{fill:var(--warnwash);stroke:var(--warn);stroke-width:1.5}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.ln{stroke:var(--ink2);stroke-width:1.6;fill:none}.lna{stroke:var(--accent);stroke-width:2;fill:none}
.head{fill:var(--ink2)}.headaccent{fill:var(--accent)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs><rect x="60" y="110" width="302.4" height="50" class="box"/><text x="211.2" y="141" text-anchor="middle" class="tb"><tspan x="211.2" dy="0">$252</tspan></text><rect x="362.4" y="110" width="72.0" height="50" class="accent"/><text x="398.4" y="141" text-anchor="middle" class="tb"><tspan x="398.4" dy="0">$60</tspan></text><rect x="434.4" y="110" width="60.0" height="50" class="accent"/><text x="464.4" y="141" text-anchor="middle" class="tb"><tspan x="464.4" dy="0">$50</tspan></text><rect x="494.4" y="110" width="165.6" height="50" class="accent"/><text x="577.1999999999999" y="141" text-anchor="middle" class="tb"><tspan x="577.1999999999999" dy="0">$138</tspan></text><line x1="660.0" y1="90" x2="660.0" y2="172" class="ln"/><text x="660.0" y="192" text-anchor="end" class="tb"><tspan x="660.0" dy="0">Goal: $500</tspan></text><line x1="211.2" y1="160" x2="211.2" y2="178" class="ln"/><text x="211.2" y="196" text-anchor="middle" class="t2"><tspan x="211.2" dy="0">Keep saving at</tspan><tspan x="211.2" dy="19">the current rate</tspan></text><line x1="398.4" y1="110" x2="398.4" y2="92" class="ln"/><text x="398.4" y="66" text-anchor="middle" class="t2"><tspan x="398.4" dy="0">Cut spending</tspan><tspan x="398.4" dy="19">(CDs, games, cheaper drinks)</tspan></text><line x1="464.4" y1="160" x2="464.4" y2="178" class="ln"/><text x="464.4" y="196" text-anchor="middle" class="t2"><tspan x="464.4" dy="0">Sell unused</tspan><tspan x="464.4" dy="19">books and golf bag</tspan></text><line x1="577.1999999999999" y1="110" x2="577.1999999999999" y2="92" class="ln"/><text x="537.1999999999999" y="66" text-anchor="middle" class="t2"><tspan x="537.1999999999999" dy="0">Walk three dogs</tspan><tspan x="537.1999999999999" dy="19">at once</tspan></text><text x="360" y="270" text-anchor="middle" class="t2"><tspan x="360" dy="0">The gap to close is $248 beyond the $252 he would save anyway.</tspan></text></svg>
